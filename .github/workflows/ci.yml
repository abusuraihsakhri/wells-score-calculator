name: Wells Score Calculator CI

on:
  push:
    branches: [master, main, 'audit/**']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and inspect dependencies
        run: |
          python -m pip install -e '.[web,test]'
          python -m pip check
      - name: Generate isolated test audit key
        run: echo "AUDIT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Python syntax checks
        run: python -m compileall -q wells.py cli.py agents tests test_wells.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Check browser calculator JavaScript
        run: |
          node --check web/calculator.js
          node web/calculator.test.cjs
